<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" width="100%" role="img" aria-labelledby="sys-title-dark">
  <title id="sys-title-dark">Core Production Technology Ecosystem Stratified by Architectural Layer</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-variant-numeric: tabular-nums; }
  </style>
  <rect x="1" y="1" width="898" height="262" rx="12" fill="#111822" stroke="#223042" stroke-width="1" />
  <text x="24" y="31" class="mono" font-size="10.5" font-weight="700" fill="#CBD5E1" letter-spacing="0.8">ARCHITECTURE MATRIX // TECHNOLOGY ECOSYSTEM BY SYSTEM LAYER</text>
  <text x="876" y="31" text-anchor="end" class="mono" font-size="10" fill="#64748B">PRODUCTION + INDEPENDENT BUILDS</text>
  <line x1="24" y1="39" x2="876" y2="39" stroke="#223042" stroke-width="1" />
  <g transform="translate(24, 48)"><rect width="418" height="92" rx="8" fill="#0F1620" stroke="#223042" stroke-width="1" /><circle cx="16" cy="20" r="3" fill="#22D3EE" /><text x="26" y="24" class="mono" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.6">01 // SERVICE &amp; API ARCHITECTURE</text><text x="16" y="46" class="sans" font-size="12.4" font-weight="700" fill="#F1F5F9">Java (8–17) · Spring Boot 3 · FastAPI · TypeScript</text><text x="16" y="66" class="sans" font-size="11.2" fill="#CBD5E1">Domain microservices, declarative Feign orchestration, REST contracts,</text><text x="16" y="82" class="sans" font-size="11.2" fill="#CBD5E1">JWT/Scrypt authentication, role-based access control &amp; AOP telemetry.</text></g>
  <g transform="translate(458, 48)"><rect width="418" height="92" rx="8" fill="#0F1620" stroke="#223042" stroke-width="1" /><circle cx="16" cy="20" r="3" fill="#10B981" /><text x="26" y="24" class="mono" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.6">02 // EVENT STREAMS, MEDIA &amp; APPLIED AI</text><text x="16" y="46" class="sans" font-size="12.4" font-weight="700" fill="#F1F5F9">Apache Kafka · FFmpeg · Whisper ASR · Gemini &amp; TTS</text><text x="16" y="66" class="sans" font-size="11.2" fill="#CBD5E1">Asynchronous producer/consumer pipelines, live 4K container remuxing,</text><text x="16" y="82" class="sans" font-size="11.2" fill="#CBD5E1">OCR/speech extraction, and zero-DB 9-stage hybrid MMR ranking.</text></g>
  <g transform="translate(24, 152)"><rect width="418" height="92" rx="8" fill="#0F1620" stroke="#223042" stroke-width="1" /><circle cx="16" cy="20" r="3" fill="#22D3EE" /><text x="26" y="24" class="mono" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.6">03 // POLYGLOT PERSISTENCE &amp; CACHING</text><text x="16" y="46" class="sans" font-size="12.4" font-weight="700" fill="#F1F5F9">PostgreSQL · MongoDB · Redis · MSSQL · Turso LibSQL</text><text x="16" y="66" class="sans" font-size="11.2" fill="#CBD5E1">Indexed relational &amp; document models, cross-service transactions,</text><text x="16" y="82" class="sans" font-size="11.2" fill="#CBD5E1">Single-Flight L1/L2 caching, and 3NF cloud-replicated SQLite.</text></g>
  <g transform="translate(458, 152)"><rect width="418" height="92" rx="8" fill="#0F1620" stroke="#223042" stroke-width="1" /><circle cx="16" cy="20" r="3" fill="#F59E0B" /><text x="26" y="24" class="mono" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.6">04 // RUNTIME, SECURITY &amp; VERIFICATION</text><text x="16" y="46" class="sans" font-size="12.4" font-weight="700" fill="#F1F5F9">Docker · Kubernetes · JUnit 5 · WireMock · Vitest · React</text><text x="16" y="66" class="sans" font-size="11.2" fill="#CBD5E1">Multi-stage non-root containers, RFC1918/metadata SSRF filtering,</text><text x="16" y="82" class="sans" font-size="11.2" fill="#CBD5E1">contract simulation, E2E security suites, and web/desktop UIs.</text></g>
</svg>
