name: Update Workspace Telemetry SVGs

on:
  schedule:
    # Weekly on Mondays at 04:17 UTC — avoids noisy daily bot commits while keeping metrics fresh
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-telemetry:
    name: Render & Validate Dual-Theme Telemetry SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12 (stdlib only — zero pip dependencies)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Render and XML-validate telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_telemetry.py

      - name: Commit updated telemetry only when metrics changed
        run: |
          if [ -z "$(git status --porcelain assets/telemetry-dark.svg assets/telemetry-light.svg .cache/telemetry_snapshot.json)" ]; then
            echo "No telemetry changes detected; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-dark.svg assets/telemetry-light.svg .cache/telemetry_snapshot.json
          git commit -m "chore(telemetry): sync workspace telemetry SVGs [skip ci]"
          git push
